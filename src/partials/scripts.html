<script>
    // 手機版選單開關（用 class 切換，動畫交給 CSS）
    (function () {
        var toggle = document.getElementById('menuToggle');
        var overlay = document.getElementById('mobileOverlay');
        if (!toggle || !overlay) return;

        function setMenu(open) {
            overlay.classList.toggle('open', open);
            toggle.classList.toggle('open', open);
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            toggle.setAttribute('aria-label', open ? '關閉選單' : '開啟選單');
            document.body.style.overflow = open ? 'hidden' : '';
        }

        toggle.addEventListener('click', function () {
            setMenu(!overlay.classList.contains('open'));
        });
        toggle.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                setMenu(!overlay.classList.contains('open'));
            }
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') setMenu(false);
        });
        overlay.querySelectorAll('[data-close-menu]').forEach(function (el) {
            el.addEventListener('click', function () { setMenu(false); });
        });
    })();

    // 影片滑進畫面才載入播放（preload="none" + poster，首次載入不抓影片檔）
    (function () {
        var vids = document.querySelectorAll('video[data-autoplay-in-view]');
        if (!vids.length) return;

        // 使用者若要求減少動態效果，就停在 poster 不自動播
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            vids.forEach(function (v) { v.setAttribute('controls', ''); });
            return;
        }

        function play(v) {
            if (v.preload === 'none') v.preload = 'auto';
            var p = v.play();
            // 省電模式、低電量或瀏覽器政策擋下自動播放時，至少讓人可以自己點播
            if (p && p.catch) p.catch(function () { v.setAttribute('controls', ''); });
        }

        if (!('IntersectionObserver' in window)) {   // 舊瀏覽器就直接播
            vids.forEach(play);
            return;
        }

        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (e.isIntersecting) play(e.target);
                else e.target.pause();               // 離開畫面就暫停，不浪費電
            });
        }, { rootMargin: '200px 0px' });

        vids.forEach(function (v) { io.observe(v); });
    })();

    // 追蹤「打包帶走」的下載與聯繫點擊
    // 用自訂事件名稱，避免和 GA4 加強型評估自動送的 file_download 混在一起
    (function () {
        function send(name, params) {
            if (typeof gtag !== 'function') return;      // 被擋掉或還沒載入就算了
            gtag('event', name, params);
        }

        document.addEventListener('click', function (e) {
            var a = e.target.closest && e.target.closest('a[href]');
            if (!a) return;
            var href = a.getAttribute('href') || '';

            // 打包帶走的檔案：記下是哪一份、哪一冊
            if (href.indexOf('takeaways/') === 0) {
                var card = a.closest('.tk-card');
                var title = card && card.querySelector('.tk-title');
                send('takeaway_download', {
                    item_name: title ? title.textContent.trim() : '(未知)',
                    file_name: decodeURIComponent(href.split('/').pop()),
                    link_url: a.href
                });
                return;
            }

            // 聯繫管道：Line 與 Email
            if (/^mailto:/i.test(href) || href.indexOf('line.me') > -1) {
                send('contact_click', {
                    method: /^mailto:/i.test(href) ? 'email' : 'line',
                    link_url: href
                });
            }
        }, true);
    })();

    // 回到頂端
    (function () {
        var btn = document.getElementById('backToTop');
        if (!btn) return;
        window.addEventListener('scroll', function () {
            btn.classList.toggle('show', window.scrollY > 300);
        }, { passive: true });
        btn.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    })();
</script>{{PAGE_SCRIPT}}
